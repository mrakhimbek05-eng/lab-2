tasks:"<li>Жарықтың сыну заңын және сыну көрсеткішінің физикалық мағынасын қарастыру (теория).</li><li>Түсу бұрышының кемінде 5 мәнінде (10°–70°) сыну бұрышын өлшеп, кестеге жазу.</li><li>sin α, sin γ және n = sin α / sin γ мәнін есептеп, sin α–sin γ графигін салу.</li><li>Өлшеу қателіктерін (абсолютті және салыстырмалы) есептеу.</li><li>Табылған n мәнін кестелік мәнмен салыстырып, эксперимент нәтижесін бағалау.</li>",
hyp:"<b>Егер</b> жарықтың түсу бұрышын арттырсақ, <b>онда</b> сыну бұрышы да артады (әрқашан түсу бұрышынан кіші), ал sin α / sin γ қатынасы тұрақты болып қалып, n ≈ 1,5 шығады, <b>себебі</b> жарық шыныда ауадағыдан баяу таралады және Снелль заңы бойынша екі орта үшін бұл қатынас тұрақты шама.",
t1:"<b>Жарықтың сынуы</b> – жарық екі ортаның шекарасынан өткенде таралу бағытының өзгеруі (орталарда жарық жылдамдығы әртүрлі болғандықтан).",
t2:"<b>Түсу бұрышы α</b> – түскен сәуле мен нормаль арасындағы бұрыш; <b>сыну бұрышы γ</b> – сынған сәуле мен нормаль арасындағы бұрыш.",
t3:"<b>Нормаль</b> – түсу нүктесінде (O) екі ортаның бөлу шекарасына жүргізілген перпендикуляр.",
t4:"<b>Сыну көрсеткіші n</b> – вакуумдағы жарық жылдамдығының ортадағы жылдамдығына қатынасы; ол ортаның оптикалық тығыздығын көрсетеді: n неғұрлым үлкен болса, сәуле соғұрлым көп бұрылады.",
t5:"<b>Снелль заңы:</b> түскен сәуле, сынған сәуле және нормаль бір жазықтықта жатады, ал түсу бұрышы синусының сыну бұрышы синусына қатынасы – берілген екі орта үшін тұрақты шама. Ауадан шыныға өткенде (n₁ ≈ 1) n = sin α / sin γ.",

q:"Как изменяется угол преломления в стекле при изменении угла падения света и с какой точностью по отношению sin α / sin γ можно определить показатель преломления стекла?",
aim:"<b>Цель:</b> изучить преломление света при переходе из воздуха в стекло, экспериментально определить показатель преломления стекла по закону Снеллиуса и сравнить с табличным значением.<br><b>Задачи:</b>",
tasks:"<li>Рассмотреть закон преломления света и физический смысл показателя преломления (теория).</li><li>Измерить угол преломления не менее чем при 5 значениях угла падения (10°–70°) и записать в таблицу.</li><li>Вычислить sin α, sin γ и n = sin α / sin γ, построить график sin α от sin γ.</li><li>Вычислить погрешности измерений (абсолютную и относительную).</li><li>Сравнить найденное n с табличным значением и оценить результат эксперимента.</li>",
hyp:"<b>Если</b> увеличивать угол падения света, <b>то</b> угол преломления тоже увеличится (всегда оставаясь меньше угла падения), а отношение sin α / sin γ останется постоянным, n ≈ 1,5, <b>потому что</b> в стекле свет распространяется медленнее, чем в воздухе, и по закону Снеллиуса для двух сред это отношение постоянно.",
t1:"<b>Преломление света</b> – изменение направления распространения света при переходе через границу двух сред (так как скорость света в средах различна).",
t2:"<b>Угол падения α</b> – угол между падающим лучом и нормалью; <b>угол преломления γ</b> – угол между преломлённым лучом и нормалью.",
t3:"<b>Нормаль</b> – перпендикуляр к границе раздела сред, проведённый в точке падения (O).",
t4:"<b>Показатель преломления n</b> – отношение скорости света в вакууме к скорости света в среде; характеризует оптическую плотность среды: чем больше n, тем сильнее отклоняется луч.",
t5:"<b>Закон Снеллиуса:</b> падающий луч, преломлённый луч и нормаль лежат в одной плоскости, а отношение синуса угла падения к синусу угла преломления постоянно для данных двух сред. При переходе из воздуха в стекло (n₁ ≈ 1) n = sin α / sin γ.",
sym:"α – угол падения; γ – угол преломления; n – показатель преломления; c = 3·10⁸ м/с – скорость света в вакууме; v – скорость света в среде.",

safety:"<li>Никогда не направляйте лазерный луч в глаза людям; не смотрите и на луч, отражённый от стекла.</li><li>Включайте лазер только на время измерения, по окончании выключайте.</li><li>Берите пластину за края, не кладите у края стола; если разбилась – не собирайте руками, сообщите учителю.</li><li>Остерегайтесь острых концов карандаша и транспортира.</li><li>Не торопитесь на рабочем месте, не играйте с лазером.</li>",
steps:"<li>Положите белый лист на стол, совместите плоскую грань полукруглой стеклянной пластины с прямой линией; отметьте центр O и проведите в нём нормаль.</li><li>Направьте лазер так, чтобы угол падения α = 10°, луч должен попадать в точку O.</li><li>Отметьте карандашом две точки на луче, вышедшем из стекла; уберите пластину и соедините преломлённый луч с точкой O.</li><li>Измерьте транспортиром угол преломления γ.</li><li>Повторите измерение при α = 20°, 30°, 40°, 50°, 60°; запишите результаты в таблицу.</li><li>Для каждого измерения вычислите sin α, sin γ и n = sin α / sin γ.</li><li>Вычислите n̄, Δn̄ и ε, постройте график sin α от sin γ (наклон графика равен n).</li><li>Сравните n̄ с табличным значением и сделайте вывод.</li>",
howto:"<b>Работа с моделью:</b> выберите вещество и α → «Начать эксперимент» → считайте угол преломления γ по шкале и впишите в поле → «Внести измеренное значение в таблицу» → измените α и повторите (не менее 5 измерений). Верхняя таблица – предсказание модели (автоматически), нижняя – ваши измерения.",

tbh:"Показатели преломления веществ (табличные значения, λ ≈ 589 нм, относительно воздуха)",tc1:"Вещество",tc2:"Показатель преломления n",tnm:["Воздух","Лёд","Вода","Этиловый спирт","Кварц (плавленый)","Глицерин","Оргстекло (акрил)","Стекло (обычное)","Флинт","Алмаз"],accb:"♿ Особые потребности",acct:"Настройки для ученика с особыми образовательными потребностями",accsz:"Размер текста:",acchc:"Высокая контрастность",accrd:"Удобочитаемый шрифт и интервалы",accbg:"Крупные кнопки и поля",accna:"Отключить анимацию",accgd:"Показать простую инструкцию",accfc:"Режим одного раздела (по одному разделу)",accsp:"Кнопки озвучивания",accrs:"Сбросить настройки",accpv:"← Назад",accnx:"Далее →",accrdb:"🔊 Читать",spkb:"🔊 Читать",novoice:"",nospeech:"Этот браузер не поддерживает озвучивание.",gdh:"Простая инструкция",gdl:"<li>Перейдите к разделу «9. Интерактивная модель».</li><li>Выберите вещество из списка (например, стекло).</li><li>Ползунком выберите угол падения α.</li><li>Нажмите «Начать эксперимент». Луч упадёт на вещество.</li><li>Считайте со шкалы угол преломления γ и впишите его в поле.</li><li>Нажмите «Ввести измеренное значение в таблицу».</li><li>Повторите ещё 4 раза с другими углами α (всего 5 измерений).</li><li>В разделе 12 вывод появится сам.</li>",insh:"Приборы и их назначение (нажмите на название)",insdef:"Нажмите на прибор в модели или на кнопку с номером ниже – здесь появятся его название и назначение.",mdalt:"Вид сверху на лабораторный стол: лазер, стеклянная пластина, шкала углов, бумага",lb1:"Лазер",sl2:"Пластина",sl3:"Шкала",lb2:"Стеклянная пластина",lb3:"Шкала углов",lb4:"Белый лист",lb5:"Нормаль",lb6:"Карандаш",lb7:"Линейка",

pl:["Стеклянная пластина","Кювета с водой","Пластина из акрила","Кварцевая пластина","Образец алмаза"],pf:["Полуцилиндрическая стеклянная пластина","Полуцилиндрическая прозрачная кювета с водой","Полуцилиндрическая пластина из оргстекла (акрил)","Полуцилиндрическая кварцевая пластина","Полуцилиндрический образец алмаза"],sl:["Пластина","Кювета","Пластина","Пластина","Образец"],pn:["Стекло – обычное (кронгласс), n ≈ 1,50.","Вода налита в тонкостенную прозрачную кювету; стенки почти не влияют на ход луча. Внутри могут быть пузырьки воздуха.","Оргстекло лёгкое, гладкое, похоже на стекло, но преломляет чуть слабее.","Плавленый кварц очень чистый и прозрачный; показатель преломления немного ниже, чем у стекла.","У алмаза очень большой показатель преломления, поэтому луч преломляется близко к нормали; грани сверкают."],in2:"<b>{N}</b> – исследуемое вещество. Луч падает на плоскую грань в точке O и преломляется внутри вещества. К круглой поверхности он подходит по радиусу, поэтому при выходе не преломляется повторно. Слабая линия – отражённый от грани луч, его не измеряем.",
in3:"<b>Шкала углов (транспортир)</b> – круговая шкала, напечатанная на бумаге. Измеряет углы α и γ от нормали; цена деления 5°. Угол преломления γ – значение там, где луч пересекает шкалу.",
in4:"<b>Белый лист</b> – основа, на которой стоят все приборы. На нём хорошо виден ход луча, отмечают точку O и нормаль, ставят карандашом точки.",
in5:"<b>Нормаль</b> – перпендикуляр к границе раздела, проведённый в точке O. Углы α и γ отсчитывают от этой линии (а не от поверхности!).",
in6:"<b>Карандаш</b> – нужен, чтобы отмечать на бумаге точки, через которые проходит луч, и проводить нормаль.",
in7:"<b>Линейка</b> – нужна, чтобы соединять отмеченные точки прямой линией и точно проводить нормаль.",h12:"12. Автоматический вывод",h13:"13. Взаимопроверка и исправление",h14:"14. План защиты (1–2 минуты)",

en:{title:"Laboratory Work No. 10: Determining the Refractive Index of Glass",sub:"8.5.1.9 – determine the refractive index of glass experimentally; 8.5.1.10 – compare the value found with the table value and evaluate the result",
print:"🖨 Print",pdf:"📄 Save as PDF",
h1:"1. Research question",h2:"2. Aim and objectives",h3:"3. Hypothesis",h4:"4. Brief theory",h5:"5. Independent, dependent and controlled variables",h6:"6. Apparatus and setup diagram",h7:"7. Safety rules (read before starting)",h8:"8. Procedure",h9:"9. Interactive model",h10:"10. Result and calculation formulas",h11:"11. Model prediction vs. value measured in the experiment",
q:"How does the angle of refraction in glass change when the angle of incidence of light changes, and how accurately can the refractive index of glass be found from the ratio sin α / sin γ?",
aim:"<b>Aim:</b> to study the refraction of light passing from air into glass, determine the refractive index of glass experimentally using Snell's law and compare it with the table value.<br><b>Objectives:</b>",
tasks:"<li>Review the law of refraction and the physical meaning of the refractive index (theory).</li><li>Measure the angle of refraction for at least 5 angles of incidence (10°–70°) and record them in a table.</li><li>Calculate sin α, sin γ and n = sin α / sin γ, and plot sin α against sin γ.</li><li>Calculate the measurement errors (absolute and relative).</li><li>Compare the n found with the table value and evaluate the experimental result.</li>",
hyp:"<b>If</b> the angle of incidence of light is increased, <b>then</b> the angle of refraction also increases (always staying smaller than the angle of incidence) while the ratio sin α / sin γ stays constant, giving n ≈ 1.5, <b>because</b> light travels slower in glass than in air and, by Snell's law, this ratio is constant for two given media.",
t1:"<b>Refraction of light</b> is the change in the direction of light when it crosses the boundary between two media (because the speed of light differs in the media).",
t2:"<b>Angle of incidence α</b> is the angle between the incident ray and the normal; <b>angle of refraction γ</b> is the angle between the refracted ray and the normal.",
t3:"<b>The normal</b> is the perpendicular to the boundary between the media drawn at the point of incidence (O).",
t4:"<b>Refractive index n</b> is the ratio of the speed of light in vacuum to its speed in the medium; it shows the optical density of the medium: the larger n is, the more the ray bends.",
t5:"<b>Snell's law:</b> the incident ray, the refracted ray and the normal lie in one plane, and the ratio of the sine of the angle of incidence to the sine of the angle of refraction is constant for two given media. For air to glass (n₁ ≈ 1), n = sin α / sin γ.",
sym:"α – angle of incidence; γ – angle of refraction; n – refractive index; c = 3·10⁸ m/s – speed of light in vacuum; v – speed of light in the medium.",
lNorm:"normal",lInc:"incident ray",lRef:"refracted ray",lAir:"air",lMed:"glass",
vc1:"Type",vc2:"Description",vi_h:"Independent",vi:"Angle of incidence α (laser direction); in the extra study – the type of material.",vd_h:"Dependent",vd:"Angle of refraction γ; sin α / sin γ and n calculated from it.",vk_h:"Controlled",vk:"The same glass block; point of incidence O; one laser (one colour of light); position of block and paper; the measuring tool (protractor).",
ap1:"Laser pointer",ap2:"Semicircular glass block",ap3:"Protractor (angle scale)",ap4:"White paper, normal and line",ap5:"Ruler and pencil",apset:"Setup diagram (top view)",lLaser:"laser",lPaper:"paper",lBlock:"glass block",lProt:"scale",
safety:"<li>Never point the laser beam at anyone's eyes; do not look at the beam reflected from the glass either.</li><li>Switch the laser on only while measuring and off when finished.</li><li>Hold the block by its edges and keep it away from the table edge; if it breaks, do not pick it up by hand – tell the teacher.</li><li>Beware of the sharp tips of the pencil and protractor.</li><li>Do not rush at the workplace and do not play with the laser.</li>",
steps:"<li>Place the white paper on the table and align the flat side of the semicircular glass block with a straight line; mark the centre O and draw the normal at O.</li><li>Aim the laser so that the angle of incidence is α = 10°, with the beam hitting point O.</li><li>Mark two points on the ray leaving the glass with a pencil, remove the block and join the refracted ray to O.</li><li>Measure the angle of refraction γ with a protractor.</li><li>Repeat for α = 20°, 30°, 40°, 50°, 60° and record the results in the table.</li><li>For every measurement calculate sin α, sin γ and n = sin α / sin γ.</li><li>Calculate n̄, Δn̄ and ε and plot sin α against sin γ (the slope of the graph equals n).</li><li>Compare n̄ with the table value and draw a conclusion.</li>",
howto:"<b>Using the model:</b> choose a material and α → “Start experiment” → read the refraction angle γ on the scale and type it in → “Enter measured value into table” → change α and repeat (at least 5 measurements). The upper table is the model prediction (automatic); the lower one holds your own measurements.",

function delStu(i){S.stu.splice(i,1);render()}
function graph(id,rows,k,col,dash){const x0=40,y0=210,sx=240,sy=190;let h='<rect width="300" height="250" fill="#fff"/>';
 for(let i=0;i<=5;i++){const v=i/5,X=x0+v*sx,Y=y0-v*sy;h+=`<line x1="${X}" y1="20" x2="${X}" y2="${y0}" stroke="#e3e8f0"/><line x1="${x0}" y1="${Y}" x2="${x0+sx}" y2="${Y}" stroke="#e3e8f0"/><text x="${X}" y="224" font-size="10" text-anchor="middle">${v.toFixed(1).replace('.',',')}</text><text x="34" y="${Y+3}" font-size="10" text-anchor="end">${v.toFixed(1).replace('.',',')}</text>`}
 h+=`<line x1="${x0}" y1="${y0}" x2="${x0+sx}" y2="${y0}" stroke="#222"/><line x1="${x0}" y1="20" x2="${x0}" y2="${y0}" stroke="#222"/><text x="160" y="242" font-size="12" text-anchor="middle" font-style="italic">sin γ</text><text x="12" y="115" font-size="12" font-style="italic" transform="rotate(-90 12 115)">sin α</text>`;
 if(k){const x=Math.min(1,1/k);h+=`<line x1="${x0}" y1="${y0}" x2="${x0+x*sx}" y2="${y0-k*x*sy}" stroke="${col}" stroke-width="1.5" ${dash?'stroke-dasharray="5 4"':''}/><text x="${x0+8}" y="34" font-size="12" fill="${col}">k = n ≈ ${f(k,2)}</text>`}
 rows.forEach(r=>{h+=`<circle cx="${x0+sn(r.b)*sx}" cy="${y0-sn(r.a)*sy}" r="4" fill="${col}"/>`});$(id).innerHTML=h}
function card(s){const t=tt();if(!s)return t.none;return`${t.lmean} = <b>${f(s.m)}</b><br>${t.ldn} = <b>${f(s.dn)}</b><br>${t.leps} = <b>${f(s.eps,2)} %</b><br>${t.lk} = <b>${f(s.k)}</b><br><i>n = ${f(s.m)} ± ${f(s.dn)}</i>`}
function bar(sm,ss){const X=n=>40+(n-1)/1.6*520;let h='<line x1="40" y1="60" x2="560" y2="60" stroke="#222"/>';
 for(let n=1;n<=2.601;n+=.2)h+=`<line x1="${X(n)}" y1="56" x2="${X(n)}" y2="64" stroke="#222"/><text x="${X(n)}" y="78" text-anchor="middle">${n.toFixed(1).replace('.',',')}</text>`;
 const nt=MAT[S.m];h+=`<line x1="${X(nt)}" y1="15" x2="${X(nt)}" y2="60" stroke="#17803d" stroke-width="3"/><text x="${X(nt)}" y="12" text-anchor="middle" fill="#17803d">${tt().cT} ${f(nt,2)}</text>`;
 if(sm)h+=`<circle cx="${X(sm.m)}" cy="60" r="5" fill="#1d4f91"/>`;
 if(ss)h+=`<line x1="${X(ss.m-ss.dn)}" y1="40" x2="${X(ss.m+ss.dn)}" y2="40" stroke="#d22" stroke-width="3"/><line x1="${X(ss.m-ss.dn)}" y1="35" x2="${X(ss.m-ss.dn)}" y2="45" stroke="#d22" stroke-width="2"/><line x1="${X(ss.m+ss.dn)}" y1="35" x2="${X(ss.m+ss.dn)}" y2="45" stroke="#d22" stroke-width="2"/><circle cx="${X(ss.m)}" cy="40" r="5" fill="#d22"/>`;
 $('bar').innerHTML=h}
function render(){const t=tt(),sm=st(S.mod),ss=st(S.stu);
 $('alv').textContent=S.a+'°';tbl('tm',S.mod,sm,false);tbl('ts',S.stu,ss,true);
 graph('gm',S.mod,sm?MAT[S.m]:0,'#1d4f91',true);graph('gs',S.stu,ss?ss.k:0,'#d22',false);
 $('rm').innerHTML=card(sm);$('rs').innerHTML=card(ss);
 $('ro').innerHTML=`<small>${t.ser} ${S.ser} · ${S.on?t.ro1:t.ro0} · N = ${S.stu.length}/5</small>`;
 const nt=MAT[S.m],dv=s=>s?f(Math.abs(s.m-nt)/nt*100,2):'—';
 $('cmp').innerHTML=`<tr><td>${t.cn}</td><td>${sm?f(sm.m):'—'}</td><td>${ss?f(ss.m)+' ± '+f(ss.dn):'—'}</td><td>${f(nt,2)}</td></tr><tr><td>${t.ce}</td><td>${sm?f(sm.eps,2):'—'}</td><td>${ss?f(ss.eps,2):'—'}</td><td>—</td></tr><tr><td>${t.cdev}</td><td>${dv(sm)}</td><td>${dv(ss)}</td><td>0</td></tr>`;
 $('concl').innerHTML=ss?(Math.abs(ss.m-nt)<=ss.dn?'<b class="ok">'+t.cok+'</b>':'<b class="bad">'+t.cbad+'</b>'):t.cno;
 bar(sm,ss);drawModel();}
function reset(){S.mod=[];S.stu=[];S.on=false;$('chkr').textContent='';$('msg').textContent='';render()}
$('al').oninput=e=>{S.a=+e.target.value;S.on=false;render()};
$('mat').onchange=e=>{S.m=+e.target.value;S.ser++;reset();insUI()};
$('bs').onclick=()=>{S.on=true;S.b=Math.round(deg(Math.asin(sn(S.a)/MAT[S.m]))*10)/10;upsert(S.mod,S.a,S.b);$('msg').textContent='';render();go()};
$('be').onclick=()=>{const m=$('msg');if(!S.on){m.textContent=tt().m1;return}const v=num($('bi').value);if(!(v>0&&v<90)){m.textContent=tt().m2;return}
 upsert(S.stu,S.a,v);$('bi').value='';m.textContent='';render()};
$('br').onclick=()=>{S.ser++;['sn','sd','se'].forEach(i=>$(i).value='');reset()};
$('chk').onclick=()=>{const t=tt(),s=st(S.stu);if(!s){$('chkr').textContent=t.need;return}
 const c=(id,v,l)=>{const x=num($(id).value),ok=isFinite(x)&&Math.abs(x-v)<=Math.max(.03*Math.abs(v),.01);return ok?`<span class="ok">${l}: ✅ ${t.okk}</span>`:`<span class="bad">${l}: ❌ ${t.badd} ${f(v,l==='ε'?2:3)}</span>`};
 $('chkr').innerHTML=[c('sn',s.m,'n̄'),c('sd',s.dn,'Δn̄'),c('se',s.eps,'ε')].join(' &nbsp; ')};
$('bp').onclick=()=>window.print();
$('bpdf').onclick=()=>{const o=document.title;document.title='Lab10_Refraction_index';window.print();document.title=o};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
(function(){let h='';for(let t=0;t<=180;t+=10){const a=rad(t),L=t%30?5:9;h+=`<line x1="${60-50*Math.cos(a)}" y1="${70-50*Math.sin(a)}" x2="${60-(50-L)*Math.cos(a)}" y2="${70-(50-L)*Math.sin(a)}" stroke="#654"/>`}
 $('protr').insertAdjacentHTML('beforeend',h+'<line x1="60" y1="70" x2="60" y2="30" stroke="#654"/><circle cx="60" cy="70" r="2.5" fill="#654"/>')})();
setLang('kk');

/* ===== Accessibility ===== */
const ACC={z:1,hc:0,readf:0,big:0,noanim:0,guide:0,focus:0,speak:0};
let fidx=0;
const SEC=()=>[...document.querySelectorAll('main>section')].filter(x=>!x.classList.contains('accsec')||document.body.classList.contains('acc-guide'));
function accSave(){try{localStorage.setItem('lab10acc',JSON.stringify(ACC))}catch(e){}}
function accApply(){
 const b=document.body;
 document.documentElement.style.setProperty('--z',ACC.z);$('zv').textContent=Math.round(ACC.z*100)+'%';
 b.classList.toggle('acc-hc',!!ACC.hc);b.classList.toggle('acc-readf',!!ACC.readf);b.classList.toggle('acc-big',!!ACC.big);
 b.classList.toggle('acc-guide',!!ACC.guide);b.classList.toggle('acc-speak',!!ACC.speak);b.classList.toggle('acc-focus',!!ACC.focus);
 window.NOANIM=!!ACC.noanim;
 ['hc','readf','big','noanim','guide','focus','speak'].forEach(k=>$('o-'+k).checked=!!ACC[k]);
 focusShow();accSave();
}
function focusShow(){
 const all=document.querySelectorAll('main>section');all.forEach(x=>x.classList.remove('cur'));
 if(!ACC.focus){return}
 const L=SEC();if(fidx>=L.length)fidx=L.length-1;if(fidx<0)fidx=0;
 L[fidx].classList.add('cur');$('fpos').textContent=(fidx+1)+' / '+L.length;
 $('fprev').disabled=fidx===0;$('fnext').disabled=fidx===L.length-1;window.scrollTo(0,0);
}
function speakText(t){
 const msg=$('accmsg');msg.textContent='';
 if(!('speechSynthesis' in window)){msg.textContent=T[lang].nospeech;return}
 const ss=speechSynthesis;if(ss.speaking){ss.cancel();return}
 const codes={kk:'kk-KZ',ru:'ru-RU',en:'en-US'};let code=codes[lang];
 const vs=ss.getVoices();
 if(vs.length&&!vs.some(v=>v.lang.toLowerCase().startsWith(lang))){
  if(lang==='kk'){code='ru-RU';msg.textContent=T.kk.novoice}
 }
 const u=new SpeechSynthesisUtterance(t);u.lang=code;u.rate=.9;ss.speak(u);
}
function secText(sec){
 const c=sec.cloneNode(true);c.querySelectorAll('.spk,svg,textarea,script').forEach(e=>e.remove());
 return c.innerText||c.textContent;
}
function addSpk(){
 document.querySelectorAll('main>section').forEach(sec=>{
  if(sec.querySelector('.spk'))return;
  const bt=document.createElement('button');bt.className='spk noprint';bt.textContent=T[lang].spkb;
  bt.onclick=()=>speakText(secText(sec));sec.insertBefore(bt,sec.firstChild);
 });
}
function refreshSpk(){document.querySelectorAll('.spk').forEach(b=>b.textContent=T[lang].spkb)}
$('accbtn').onclick=()=>{const p=$('accp');const o=p.classList.toggle('open');$('accbtn').setAttribute('aria-expanded',o)};
$('zm').onclick=()=>{ACC.z=Math.max(.8,+(ACC.z-.1).toFixed(2));accApply()};
$('zp').onclick=()=>{ACC.z=Math.min(1.8,+(ACC.z+.1).toFixed(2));accApply()};
['hc','readf','big','noanim','guide','focus','speak'].forEach(k=>$('o-'+k).onchange=e=>{ACC[k]=e.target.checked?1:0;if(k==='focus')fidx=0;accApply()});
$('accrst').onclick=()=>{Object.assign(ACC,{z:1,hc:0,readf:0,big:0,noanim:0,guide:0,focus:0,speak:0});if('speechSynthesis' in window)speechSynthesis.cancel();accApply()};
$('fprev').onclick=()=>{fidx--;focusShow()};$('fnext').onclick=()=>{fidx++;focusShow()};
$('fspk').onclick=()=>{const L=SEC();speakText(secText(L[fidx]))};
try{const sv=JSON.parse(localStorage.getItem('lab10acc')||'null');if(sv)Object.assign(ACC,sv)}catch(e){}
addSpk();accApply();
const _sl=setLang;setLang=function(l){_sl(l);refreshSpk()};
</script></body></html>
